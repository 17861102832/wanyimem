[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wanyimem"
version = "1.0.2"
description = "永不遗忘的全量记忆系统 — 事件溯源 + 过程记忆 + 语义向量检索 + reranker精排 + 记忆图谱 + 元认知知识空白，23个MCP工具"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zhao Xikun" }]
keywords = ["memory", "mcp", "long-term-memory", "agent", "rag", "vector", "knowledge-graph", "metacognition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
vector = ["sentence-transformers>=2.7"]
rerank = ["sentence-transformers>=2.7"]
all = ["sentence-transformers>=2.7"]
test = ["pytest>=7.0"]

[project.scripts]
wanyi = "wanyi.memory_core:main"

[project.urls]
Homepage = "https://github.com/17861102832/wanyimem"
Repository = "https://github.com/17861102832/wanyimem"
Documentation = "https://github.com/17861102832/wanyimem"

[tool.hatch.build.targets.wheel]
packages = ["wanyi"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# 万忆中枢是"降级优先"系统：模型/向量不可用时静默降级是刻意设计，
# 因此忽略盲 except（BLE001）、try-except-pass（S110/S112）。
# 其余规则保持默认（E/F/I/UP/B/S 等）。
ignore = [
    "BLE001",  # 允许盲 except：静默降级是核心设计（模型不可用→返回None不崩溃）
    "S110",    # 允许 try-except-pass：同上
    "S112",    # 允许 try-except-continue：同上
    "RUF013",  # 允许隐式 Optional：兼容旧式注解
    "DTZ005",  # 本地单机工具，不强制时区参数
    "C401",    # 集合推导风格
    "RUF012",  # 允许可变类属性默认值
    "PERF102", # 性能微优化提示，非必要
    "EXE001",  # shebang 保留（Linux 用户可直接执行），Windows 推送无执行位
]
